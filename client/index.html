<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta property="og:image" content="/ogImage.png">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Email Campaign Dashboard - manage subscribers and send e-mail campaigns. React, TypeScript, Express and Airtable."
    />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Email Campaign Dashboard - Szymon Rojek</title>
    <!-- the saved theme before the first paint - no white flash in dark mode -->
    <script>
      try {
        var theme = localStorage.getItem("theme") || "system";
        var dark =
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
