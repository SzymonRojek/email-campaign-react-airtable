<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Talent Outreach - send job offers to the right candidates in your talent pool: by role and budget, personalized, never too often. React, TypeScript, Express and Airtable."
    />
    <link rel="apple-touch-icon" href="/icon192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Talent Outreach - Szymon Rojek</title>
    <!-- the preview when the link is shared (LinkedIn, Messenger, Slack...) - full addresses,
         some apps do not follow relative ones -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Talent Outreach" />
    <meta property="og:url" content="https://talent-outreach.onrender.com/" />
    <meta property="og:title" content="Talent Outreach - job offers for recruiters" />
    <meta
      property="og:description"
      content="Send job offers to the right candidates in your talent pool - by role and budget, personalized, and never too often. Try the demo with one click."
    />
    <meta property="og:image" content="https://talent-outreach.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Talent Outreach - send job offers to the right candidates" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- the saved theme before the first paint - no white flash in dark mode -->
    <script>
      try {
        var theme = localStorage.getItem("theme") || "system";
        var dark =
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
