name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # same version as "engines" in package.json (production on Heroku)
          node-version: 16
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      # jest for the server lives in server/ so it does not clash with react-scripts' jest
      - name: Install server test tooling
        run: npm ci --prefix server

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.test.json

      - name: Server unit tests
        run: npm run test:coverage

      - name: Build server
        run: npm run build:server

      # npm install (not npm ci) - same as heroku-postbuild in production;
      # client/package-lock.json is out of sync with client/package.json
      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Typecheck client
        run: npm run typecheck
        working-directory: client

      - name: Client unit tests
        run: npm run test:coverage
        working-directory: client
        env:
          CI: true

      # CI=true makes every ESLint warning fail the build
      - name: Build client
        run: npm run build
        working-directory: client
        env:
          CI: true
