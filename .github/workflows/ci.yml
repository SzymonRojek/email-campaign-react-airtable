name: CI

on:
  # every PR is checked before the human merges it (feature -> dev, dev -> main);
  # main is checked again after the merge - it is what Render deploys
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

# a new commit in the same PR cancels the older, now pointless run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # same version as "engines" in package.json (production on Render)
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      # jest + supertest for the server live in server/package.json
      - name: Install server test tooling
        run: npm ci --prefix server

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.test.json

      - name: Server unit tests
        run: npm run test:coverage

      - name: Build server
        run: npm run build:server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Typecheck client
        run: npm run typecheck
        working-directory: client

      # warnings fail the job too (like the old CRA build with CI=true)
      - name: Lint client
        run: npm run lint -- --max-warnings=0
        working-directory: client

      - name: Client unit tests
        run: npm run test:coverage
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            client/build
            server/dist

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: app-build

      # express etc. for the compiled server and the fake Airtable
      - name: Install server dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  # the Postman collection (postman/) run by Newman against the server build
  # and the fake Airtable - every endpoint, from the outside
  api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: app-build

      # express etc. for the compiled server and the fake Airtable; Newman lives in e2e/
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix e2e

      - name: API tests (Postman / Newman)
        run: npm run test:api

  # Lighthouse on the main screens (the build + the fake Airtable): accessibility, best
  # practices and SEO must stay at 100; the HTML reports are kept as an artifact
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: app-build

      # Google Chrome is already on the GitHub runner
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix e2e

      - name: Lighthouse
        run: npm run test:lighthouse

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: e2e/lighthouse-reports
