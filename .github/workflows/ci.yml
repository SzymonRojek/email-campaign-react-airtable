name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # same version as "engines" in package.json (production on Render)
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      # jest for the server lives in server/ so it does not clash with react-scripts' jest
      - name: Install server test tooling
        run: npm ci --prefix server

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.test.json

      - name: Server unit tests
        run: npm run test:coverage

      - name: Build server
        run: npm run build:server

      # npm install (not npm ci) - same as the build on Render;
      # client/package-lock.json is out of sync with client/package.json
      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Typecheck client
        run: npm run typecheck
        working-directory: client

      - name: Client unit tests
        run: npm run test:coverage
        working-directory: client
        env:
          CI: true

      # CI=true makes every ESLint warning fail the build
      - name: Build client
        run: npm run build
        working-directory: client
        env:
          CI: true
          # react-scripts 4 (webpack 4) needs the legacy OpenSSL on Node 17+
          NODE_OPTIONS: --openssl-legacy-provider

      - uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            client/build
            server/dist

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: app-build

      # express etc. for the compiled server and the fake Airtable
      - name: Install server dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
